<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 基本資料｜自由倒數</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #F6F2E9;
      color: #304A3A;
    }

    .page {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 22px 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 */
    .brand {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #718173;
      margin-bottom: 22px;
    }

    .step {
      text-align: center;
      margin-bottom: 20px;
    }

    .step-number {
      font-size: 20px;
      font-weight: 700;
      color: #8A9B8B;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .step-title {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 800;
      color: #304A3A;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      color: #7B867D;
      margin-top: 10px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    /* 主卡片 */
    .card {
      position: relative;
      background: #FFFDF8;
      border-radius: 28px;
      padding: 25px 22px 24px;
      box-shadow: 0 10px 30px rgba(72, 82, 66, 0.08);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #E7EEE5;
      top: -65px;
      right: -35px;
      opacity: 0.75;
    }

    .section-title {
      position: relative;
      font-size: 19px;
      font-weight: 800;
      color: #304A3A;
      margin-bottom: 23px;
    }

    /* 欄位 */
    .field {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #536456;
      margin-bottom: 9px;
    }

    input[type="text"],
    input[type="date"] {
      width: 100%;
      height: 54px;
      border: 1px solid #E1E5DC;
      border-radius: 16px;
      background: #F8F8F3;
      padding: 0 16px;
      font-family: inherit;
      font-size: 17px;
      color: #304A3A;
      outline: none;
      transition: 0.2s;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      border-color: #A5B6A5;
      background: #FFFDF8;
      box-shadow: 0 0 0 3px rgba(165, 182, 165, 0.16);
    }

    input::placeholder {
      color: #A4ADA4;
    }

    /* 日期 */
    .date-wrap {
      position: relative;
    }

    input[type="date"] {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 48px;
    }

    .date-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      pointer-events: none;
    }

    /* 年齡 */
    .age-box {
      width: 100%;
      min-height: 64px;
      border-radius: 18px;
      background: #EDF2EA;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #304A3A;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* 撫養選項 */
    .choice-row {
      display: flex;
      gap: 10px;
    }

    .choice {
      flex: 1;
      height: 52px;
      border: 1px solid #E1E5DC;
      border-radius: 16px;
      background: #F8F8F3;
      color: #657267;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice.active {
      background: #DCE7DA;
      border-color: #B4C5B2;
      color: #304A3A;
    }

    /* 人數 */
    .support-count {
      display: none;
      margin-top: 14px;
    }

    .support-count.show {
      display: block;
    }

    .count-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-btn {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      border: none;
      border-radius: 15px;
      background: #E9EEE6;
      color: #405543;
      font-size: 25px;
      font-weight: 500;
      cursor: pointer;
    }

    .count-input {
      flex: 1;
      width: 100%;
      height: 50px;
      border: 1px solid #E1E5DC;
      border-radius: 15px;
      background: #F8F8F3;
      text-align: center;
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      color: #304A3A;
      outline: none;
    }

    .count-input:focus {
      border-color: #A5B6A5;
      background: #FFFDF8;
    }

    .count-hint {
      margin-top: 7px;
      font-size: 13px;
      color: #929B92;
      text-align: center;
    }

    /* 底部按鈕 */
    .navigation {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .nav-btn {
      flex: 1;
      min-height: 52px;
      border-radius: 17px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      transition: 0.2s;
    }

    .back-btn {
      background: #E9EDE7;
      color: #536456;
    }

    .next-btn {
      background: #607967;
      color: #FFFFFF;
      box-shadow: 0 7px 16px rgba(77, 101, 83, 0.18);
    }

    .nav-btn:active {
      transform: scale(0.98);
    }

    /* Footer */
    footer {
      text-align: center;
      color: #A1AAA1;
      font-size: 12px;
      margin-top: 16px;
      padding-top: 4px;
    }

    /* 手機微調 */
    @media (max-height: 760px) {
      .page {
        padding-top: 15px;
      }

      .brand {
        margin-bottom: 13px;
      }

      .step {
        margin-bottom: 12px;
      }

      .step-title {
        font-size: 29px;
      }

      .subtitle {
        margin-top: 7px;
        margin-bottom: 15px;
      }

      .card {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .field {
        margin-bottom: 14px;
      }

      .section-title {
        margin-bottom: 16px;
      }

      .navigation {
        margin-top: 14px;
      }

      footer {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <main class="container">

    <div class="brand">
      自由倒數｜試算工具
    </div>

    <div class="step">
      <div class="step-number">01</div>
      <div class="step-title">基本資料</div>
    </div>

    <div class="subtitle">
      輸入基本資料，開始探索你的未來
    </div>

    <section class="card">

      <div class="section-title">
        📍 你的起點
      </div>

      <!-- 姓名／暱稱 -->
      <div class="field">
        <label class="label" for="nickname">
          姓名／暱稱
        </label>

        <input
          type="text"
          id="nickname"
          placeholder="輸入你的暱稱"
          autocomplete="name"
        >
      </div>

      <!-- 出生年月日 -->
      <div class="field">
        <label class="label" for="birthDate">
          出生年月日 🎂
        </label>

        <div class="date-wrap">
          <input
            type="date"
            id="birthDate"
            value="1994-01-01"
          >
          <span class="date-icon">📅</span>
        </div>
      </div>

      <!-- 目前年齡 -->
      <div class="field">
        <label class="label">
          目前年齡
        </label>

        <div class="age-box" id="ageDisplay">
          32 歲
        </div>
      </div>

      <!-- 撫養人數 -->
      <div class="field" style="margin-bottom: 0;">
        <label class="label">
          目前需要撫養人數
        </label>

        <div class="choice-row">
          <button
            type="button"
            class="choice active"
            id="noSupport"
          >
            沒有
          </button>

          <button
            type="button"
            class="choice"
            id="hasSupport"
          >
            有
          </button>
        </div>

        <div class="support-count" id="supportCountBox">

          <label class="label" style="margin-bottom: 8px;">
            需要撫養幾位？
          </label>

          <div class="count-row">

            <button
              type="button"
              class="count-btn"
              id="minusBtn"
            >
              −
            </button>

            <input
              type="number"
              class="count-input"
              id="supportCount"
              min="1"
              max="20"
              value="1"
              inputmode="numeric"
            >

            <button
              type="button"
              class="count-btn"
              id="plusBtn"
            >
              ＋
            </button>

          </div>

          <div class="count-hint">
            可直接輸入人數
          </div>

        </div>
      </div>

    </section>

    <!-- 上一步／下一步 -->
    <nav class="navigation">

      <a
        href="index.html"
        class="nav-btn back-btn"
      >
        ← 回到首頁
      </a>

      <a
        href="finance.html"
        class="nav-btn next-btn"
      >
        下一步 →
      </a>

    </nav>

    <footer>
      © 2026 TY Chen
    </footer>

  </main>

</div>


<script>
  const STORAGE_KEY = "freedomCountdownBasic";

  const nicknameInput = document.getElementById("nickname");
  const birthDateInput = document.getElementById("birthDate");
  const ageDisplay = document.getElementById("ageDisplay");

  const noSupport = document.getElementById("noSupport");
  const hasSupport = document.getElementById("hasSupport");

  const supportCountBox = document.getElementById("supportCountBox");
  const supportCountInput = document.getElementById("supportCount");

  const minusBtn = document.getElementById("minusBtn");
  const plusBtn = document.getElementById("plusBtn");


  /* -------------------------
     計算目前年齡
  ------------------------- */

  function calculateAge(dateString) {

    if (!dateString) {
      return 0;
    }

    const birthDate = new Date(dateString + "T00:00:00");

    if (isNaN(birthDate.getTime())) {
      return 0;
    }

    const today = new Date();

    let age =
      today.getFullYear() -
      birthDate.getFullYear();

    const monthDifference =
      today.getMonth() -
      birthDate.getMonth();

    if (
      monthDifference < 0 ||
      (
        monthDifference === 0 &&
        today.getDate() < birthDate.getDate()
      )
    ) {
      age--;
    }

    return Math.max(age, 0);
  }


  function updateAge() {

    const age = calculateAge(
      birthDateInput.value
    );

    ageDisplay.textContent = age + " 歲";

  }


  /* -------------------------
     取得目前資料
  ------------------------- */

  function getData() {

    return {
      nickname: nicknameInput.value.trim(),

      birthDate: birthDateInput.value,

      hasSupport: hasSupport.classList.contains("active"),

      supportCount:
        Math.max(
          1,
          Math.min(
            20,
            parseInt(supportCountInput.value, 10) || 1
          )
        )
    };

  }


  /* -------------------------
     自動儲存
  ------------------------- */

  function saveData() {

    const data = getData();

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }


  /* -------------------------
     撫養狀態
  ------------------------- */

  function setSupportStatus(hasPeople) {

    if (hasPeople) {

      hasSupport.classList.add("active");
      noSupport.classList.remove("active");

      supportCountBox.classList.add("show");

    } else {

      noSupport.classList.add("active");
      hasSupport.classList.remove("active");

      supportCountBox.classList.remove("show");

    }

    saveData();

  }


  /* -------------------------
     加減人數
  ------------------------- */

  function updateSupportCount(value) {

    let count = parseInt(value, 10);

    if (isNaN(count)) {
      count = 1;
    }

    count = Math.max(
      1,
      Math.min(20, count)
    );

    supportCountInput.value = count;

    saveData();

  }


  minusBtn.addEventListener("click", function() {

    updateSupportCount(
      parseInt(supportCountInput.value, 10) - 1
    );

  });


  plusBtn.addEventListener("click", function() {

    updateSupportCount(
      parseInt(supportCountInput.value, 10) + 1
    );

  });


  supportCountInput.addEventListener(
    "input",
    function() {

      if (supportCountInput.value !== "") {
        saveData();
      }

    }
  );


  supportCountInput.addEventListener(
    "change",
    function() {

      updateSupportCount(
        supportCountInput.value
      );

    }
  );


  /* -------------------------
     生日變更
  ------------------------- */

  birthDateInput.addEventListener(
    "change",
    function() {

      updateAge();
      saveData();

    }
  );


  /* -------------------------
     暱稱自動儲存
  ------------------------- */

  nicknameInput.addEventListener(
    "input",
    function() {

      saveData();

    }
  );


  /* -------------------------
     撫養選擇
  ------------------------- */

  noSupport.addEventListener(
    "click",
    function() {

      setSupportStatus(false);

    }
  );


  hasSupport.addEventListener(
    "click",
    function() {

      setSupportStatus(true);

    }
  );


  /* -------------------------
     載入已儲存資料
  ------------------------- */

  function loadData() {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {

      birthDateInput.value =
        "1994-01-01";

      supportCountInput.value = 1;

      setSupportStatus(false);

      updateAge();

      return;
    }


    try {

      const data =
        JSON.parse(saved);


      if (
        typeof data.nickname === "string"
      ) {

        nicknameInput.value =
          data.nickname;

      }


      if (
        typeof data.birthDate === "string" &&
        data.birthDate
      ) {

        birthDateInput.value =
          data.birthDate;

      } else {

        birthDateInput.value =
          "1994-01-01";

      }


      if (data.hasSupport) {

        hasSupport.classList.add("active");
        noSupport.classList.remove("active");

        supportCountBox.classList.add("show");

      } else {

        noSupport.classList.add("active");
        hasSupport.classList.remove("active");

        supportCountBox.classList.remove("show");

      }


      const savedCount =
        parseInt(data.supportCount, 10);

      supportCountInput.value =
        Math.max(
          1,
          Math.min(
            20,
            isNaN(savedCount)
              ? 1
              : savedCount
          )
        );


      updateAge();

    } catch (error) {

      console.log(
        "讀取基本資料失敗",
        error
      );

      birthDateInput.value =
        "1994-01-01";

      supportCountInput.value = 1;

      setSupportStatus(false);

      updateAge();

    }

  }


  /* -------------------------
     初始化
  ------------------------- */

  loadData();
  updateAge();

</script>

</body>
</html>
