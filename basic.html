<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F2E9">
  <meta name="description" content="自由倒數｜基本資料">
  <title>自由倒數｜基本資料</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F6F2E9;
      --paper: #FFFDF8;

      --green-dark: #29483B;
      --green: #5E806B;
      --green-soft: #E4EEE7;

      --peach-soft: #F5E7D9;
      --peach-text: #9A6E4D;

      --text: #2D3934;
      --muted: #748078;

      --border: rgba(83, 111, 97, 0.14);

      --shadow:
        0 16px 38px rgba(59, 76, 67, 0.09),
        0 3px 10px rgba(59, 76, 67, 0.04);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        radial-gradient(
          circle at 92% 4%,
          rgba(218, 231, 222, 0.7) 0,
          rgba(218, 231, 222, 0.25) 12%,
          transparent 27%
        ),
        var(--bg);

      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ------------------------------
       裝飾
    ------------------------------ */

    .decor {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .decor-1 {
      width: 150px;
      height: 150px;
      top: -70px;
      right: -55px;
      background: rgba(204, 222, 211, 0.48);
    }

    .decor-2 {
      width: 90px;
      height: 90px;
      left: -45px;
      bottom: 80px;
      background: rgba(239, 224, 205, 0.5);
    }

    .decor-3 {
      width: 34px;
      height: 34px;
      left: 8%;
      top: 22%;
      background: rgba(221, 233, 225, 0.75);
    }

    .container {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 720px;
      min-height: 100vh;

      margin: 0 auto;

      padding:
        24px
        18px
        16px;

      display: flex;
      flex-direction: column;
    }

    /* ------------------------------
       網站名稱
    ------------------------------ */

    .brand {
      text-align: center;
    }

    .brand-title {
      color: var(--green-dark);

      font-size: clamp(20px, 5.4vw, 27px);
      font-weight: 800;

      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    /* ------------------------------
       頁面標題
    ------------------------------ */

    .page-heading {
      text-align: center;

      margin-top: 17px;
    }

    .step-label {
      color: var(--green);

      font-size: clamp(13px, 3.6vw, 15px);
      font-weight: 800;

      letter-spacing: 0.16em;
    }

    .page-title {
      margin-top: 5px;

      color: var(--green-dark);

      font-size: clamp(27px, 7.5vw, 37px);
      font-weight: 850;

      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .page-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: clamp(14px, 3.8vw, 17px);
      font-weight: 500;

      line-height: 1.55;
      letter-spacing: 0.02em;
    }

    /* ------------------------------
       進度
    ------------------------------ */

    .progress {
      display: flex;
      align-items: center;

      width: 100%;
      max-width: 430px;

      margin: 15px auto 0;
    }

    .progress-dot {
      width: 12px;
      height: 12px;

      flex: 0 0 12px;

      border-radius: 50%;

      background: #D7E2DA;
    }

    .progress-dot.active {
      width: 15px;
      height: 15px;

      flex-basis: 15px;

      background: var(--green);
      box-shadow: 0 0 0 5px rgba(94, 128, 107, 0.12);
    }

    .progress-line {
      flex: 1;

      height: 2px;

      background: #DCE5DF;
    }

    /* ------------------------------
       基本資料卡
    ------------------------------ */

    .form-card {
      margin-top: 15px;

      padding:
        20px
        17px
        19px;

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 252, 0.98),
          rgba(251, 250, 243, 0.98)
        );

      border: 1px solid rgba(100, 126, 112, 0.16);

      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      color: var(--green-dark);

      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;

      line-height: 1.35;
    }

    .section-title::before {
      content: "";

      width: 6px;
      height: 25px;

      border-radius: 99px;

      background: var(--green);
    }

    /* ------------------------------
       表單
    ------------------------------ */

    .field {
      margin-top: 14px;
    }

    .field:first-of-type {
      margin-top: 13px;
    }

    .field-label {
      display: block;

      margin-bottom: 7px;

      color: var(--text);

      font-size: clamp(15px, 4vw, 17px);
      font-weight: 750;

      line-height: 1.4;
    }

    .input-wrap {
      width: 100%;
    }

    .text-input,
    .date-input {
      display: block;

      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 17px;

      background: #F9FAF6;

      color: var(--text);

      font-size: 16px;
      font-weight: 600;

      outline: none;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .text-input::placeholder {
      color: #A1AAA4;
      font-weight: 500;
    }

    .text-input:focus,
    .date-input:focus {
      border-color: rgba(94, 128, 107, 0.55);

      background: #FFFFFF;

      box-shadow:
        0 0 0 4px rgba(94, 128, 107, 0.09);
    }

    .date-input {
      appearance: none;
      -webkit-appearance: none;

      color-scheme: light;
    }

    /* ------------------------------
       年齡
    ------------------------------ */

    .age-result {
      display: none;

      margin-top: 8px;

      color: var(--green);

      font-size: 14px;
      font-weight: 700;

      text-align: left;
    }

    .age-result.show {
      display: block;
    }

    /* ------------------------------
       撫養家人
    ------------------------------ */

    .family-question {
      margin-top: 15px;
    }

    .choice-group {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;

      margin-top: 8px;
    }

    .choice-button {
      min-height: 50px;

      border: 1px solid rgba(83, 111, 97, 0.16);
      border-radius: 16px;

      background: #F9FAF6;

      color: var(--text);

      font-size: 16px;
      font-weight: 750;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .choice-button:hover {
      transform: translateY(-1px);
    }

    .choice-button.active {
      background: var(--green-soft);

      border-color: rgba(94, 128, 107, 0.4);

      color: var(--green-dark);

      box-shadow:
        0 5px 14px rgba(68, 104, 84, 0.08);
    }

    /* ------------------------------
       人數控制
    ------------------------------ */

    .family-count {
      display: none;

      margin-top: 10px;

      padding: 10px 14px;

      border-radius: 17px;

      background: #F7F3EC;

      align-items: center;
      justify-content: space-between;
    }

    .family-count.show {
      display: flex;
    }

    .count-label {
      color: var(--muted);

      font-size: 14px;
      font-weight: 650;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .counter-button {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: #E4EEE7;

      color: var(--green-dark);

      font-size: 23px;
      font-weight: 700;

      line-height: 1;

      cursor: pointer;
    }

    .counter-number {
      min-width: 42px;

      color: var(--green-dark);

      font-size: 17px;
      font-weight: 800;

      text-align: center;
    }

    /* ------------------------------
       下一步
    ------------------------------ */

    .next-button {
      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 52px;

      margin-top: 13px;

      border: none;
      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #5D806A,
          #466C58
        );

      color: #FFFFFF;

      text-decoration: none;

      font-size: 16px;
      font-weight: 800;

      letter-spacing: 0.04em;

      box-shadow:
        0 9px 20px rgba(68, 104, 84, 0.2);

      cursor: pointer;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .next-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px rgba(68, 104, 84, 0.25);
    }

    .next-button:active {
      transform: translateY(1px);
    }

    /* ------------------------------
       Footer
    ------------------------------ */

    .footer {
      margin-top: auto;

      padding-top: 9px;

      text-align: center;

      color: #89938D;

      font-size: 11px;

      letter-spacing: 0.05em;
    }

    /* ------------------------------
       小手機
    ------------------------------ */

    @media (max-width: 380px) {

      .container {
        padding:
          19px
          12px
          11px;
      }

      .page-heading {
        margin-top: 13px;
      }

      .progress {
        margin-top: 11px;
      }

      .form-card {
        margin-top: 11px;

        padding:
          16px
          13px
          15px;

        border-radius: 23px;
      }

      .section-title {
        font-size: 19px;
      }

      .field {
        margin-top: 11px;
      }

      .field-label {
        margin-bottom: 5px;
        font-size: 15px;
      }

      .text-input,
      .date-input {
        height: 48px;

        padding: 0 14px;

        border-radius: 15px;
      }

      .family-question {
        margin-top: 11px;
      }

      .choice-button {
        min-height: 46px;
        font-size: 15px;
      }

      .family-count {
        margin-top: 8px;
        padding: 8px 11px;
      }

      .counter-button {
        width: 34px;
        height: 34px;
      }

      .next-button {
        min-height: 48px;
        margin-top: 10px;
        font-size: 15px;
      }

      .footer {
        padding-top: 6px;
      }
    }

    /* ------------------------------
       螢幕高度較小
    ------------------------------ */

    @media (max-height: 700px) {

      .container {
        padding-top: 15px;
      }

      .page-heading {
        margin-top: 10px;
      }

      .progress {
        margin-top: 8px;
      }

      .form-card {
        margin-top: 9px;

        padding-top: 14px;
        padding-bottom: 13px;
      }

      .field {
        margin-top: 9px;
      }

      .family-question {
        margin-top: 9px;
      }

      .next-button {
        margin-top: 8px;
      }

      .footer {
        padding-top: 4px;
      }
    }

    /* ------------------------------
       減少動畫
    ------------------------------ */

    @media (prefers-reduced-motion: reduce) {

      .text-input,
      .date-input,
      .choice-button,
      .next-button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>
    <div class="decor decor-3"></div>

    <div class="container">

      <!-- 網站名稱 -->
      <header class="brand">
        <div class="brand-title">
          自由倒數｜試算工具
        </div>
      </header>


      <!-- 頁面標題 -->
      <section class="page-heading">

        <div class="step-label">
          01
        </div>

        <h1 class="page-title">
          基本資料
        </h1>

        <p class="page-subtitle">
          先認識一下現在的你<br>
          輸入基本資料，開始探索你的未來
        </p>

      </section>


      <!-- 進度 -->
      <div class="progress" aria-label="目前進度">

        <div class="progress-dot active"></div>

        <div class="progress-line"></div>

        <div class="progress-dot"></div>

        <div class="progress-line"></div>

        <div class="progress-dot"></div>

        <div class="progress-line"></div>

        <div class="progress-dot"></div>

      </div>


      <!-- 基本資料 -->
      <section class="form-card">

        <h2 class="section-title">
          關於你
        </h2>


        <!-- 姓名／暱稱 -->
        <div class="field">

          <label
            class="field-label"
            for="nickname"
          >
            姓名／暱稱
          </label>

          <div class="input-wrap">

            <input
              id="nickname"
              class="text-input"
              type="text"
              placeholder="輸入你的名字或暱稱"
              maxlength="20"
              autocomplete="name"
            >

          </div>

        </div>


        <!-- 出生年月日 -->
        <div class="field">

          <label
            class="field-label"
            for="birthdate"
          >
            出生年月日 🎂
          </label>

          <div class="input-wrap">

            <input
              id="birthdate"
              class="date-input"
              type="date"
              autocomplete="bday"
            >

          </div>

          <div
            id="ageResult"
            class="age-result"
            aria-live="polite"
          ></div>

        </div>


        <!-- 家人 -->
        <div class="family-question">

          <label class="field-label">
            目前是否有需要撫養的家人？
          </label>

          <div
            class="choice-group"
            role="group"
            aria-label="是否有需要撫養的家人"
          >

            <button
              type="button"
              class="choice-button"
              id="noFamily"
            >
              沒有
            </button>

            <button
              type="button"
              class="choice-button"
              id="hasFamily"
            >
              有
            </button>

          </div>


          <!-- 家人人數 -->
          <div
            id="familyCount"
            class="family-count"
          >

            <span class="count-label">
              需要撫養幾位家人？
            </span>

            <div class="counter">

              <button
                type="button"
                class="counter-button"
                id="minusButton"
                aria-label="減少家人人數"
              >
                −
              </button>

              <span
                class="counter-number"
                id="familyNumber"
              >
                1 位
              </span>

              <button
                type="button"
                class="counter-button"
                id="plusButton"
                aria-label="增加家人人數"
              >
                ＋
              </button>

            </div>

          </div>

        </div>

      </section>


      <!-- 下一步 -->
      <a
        class="next-button"
        href="finance.html"
      >
        下一步 →
      </a>


      <!-- 頁尾 -->
      <footer class="footer">
        © 2026 TY Chen
      </footer>

    </div>

  </main>


  <script>
    /* ------------------------------
       出生日期 → 自動計算年齡
    ------------------------------ */

    const birthdate = document.getElementById("birthdate");
    const ageResult = document.getElementById("ageResult");

    function calculateAge(dateString) {

      if (!dateString) {
        ageResult.classList.remove("show");
        ageResult.textContent = "";
        return;
      }

      const birth = new Date(dateString + "T00:00:00");

      if (Number.isNaN(birth.getTime())) {
        ageResult.classList.remove("show");
        return;
      }

      const today = new Date();

      let age =
        today.getFullYear() -
        birth.getFullYear();

      const monthDifference =
        today.getMonth() -
        birth.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {
        age--;
      }

      if (age < 0 || age > 120) {
        ageResult.classList.remove("show");
        ageResult.textContent = "";
        return;
      }

      ageResult.textContent =
        "目前年齡｜" + age + " 歲";

      ageResult.classList.add("show");
    }

    birthdate.addEventListener(
      "change",
      function () {
        calculateAge(this.value);
      }
    );


    /* ------------------------------
       家人選擇
    ------------------------------ */

    const noFamily =
      document.getElementById("noFamily");

    const hasFamily =
      document.getElementById("hasFamily");

    const familyCount =
      document.getElementById("familyCount");

    const familyNumber =
      document.getElementById("familyNumber");

    const minusButton =
      document.getElementById("minusButton");

    const plusButton =
      document.getElementById("plusButton");

    let count = 1;


    function updateFamilyCount() {

      familyNumber.textContent =
        count + " 位";
    }


    noFamily.addEventListener(
      "click",
      function () {

        noFamily.classList.add("active");
        hasFamily.classList.remove("active");

        familyCount.classList.remove("show");
      }
    );


    hasFamily.addEventListener(
      "click",
      function () {

        hasFamily.classList.add("active");
        noFamily.classList.remove("active");

        familyCount.classList.add("show");

        updateFamilyCount();
      }
    );


    minusButton.addEventListener(
      "click",
      function () {

        if (count > 1) {
          count--;
          updateFamilyCount();
        }
      }
    );


    plusButton.addEventListener(
      "click",
      function () {

        if (count < 20) {
          count++;
          updateFamilyCount();
        }
      }
    );
  </script>

</body>
</html>
