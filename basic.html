<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="自由倒數｜基本資料">
  <title>自由倒數｜基本資料</title>

  <style>
    :root {
      --bg: #F6F2E9;
      --paper: #FFFDF8;
      --green-dark: #29483B;
      --green: #5E806B;
      --green-soft: #E4EEE7;
      --peach-soft: #F5E7D9;
      --peach-text: #9A6E4D;
      --gold-soft: #F2EBD5;
      --gold-text: #8B7540;
      --text: #2D3934;
      --muted: #748078;
      --border: rgba(83, 111, 97, 0.14);
      --shadow:
        0 16px 38px rgba(59, 76, 67, 0.09),
        0 3px 10px rgba(59, 76, 67, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 92% 5%, rgba(228, 238, 231, 0.75), transparent 28%),
        var(--bg);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .decor {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .decor-1 {
      width: 150px;
      height: 150px;
      top: 70px;
      right: -65px;
      background: rgba(228, 238, 231, 0.7);
    }

    .decor-2 {
      width: 95px;
      height: 95px;
      top: 390px;
      left: -45px;
      background: rgba(245, 231, 217, 0.7);
    }

    .decor-3 {
      width: 55px;
      height: 55px;
      right: 20px;
      bottom: 105px;
      background: rgba(242, 235, 213, 0.8);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 18px 10px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      text-align: center;
      color: var(--green-dark);
      font-size: clamp(20px, 5.4vw, 27px);
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 24px;
    }

    .page-heading {
      margin-bottom: 18px;
    }

    .page-number {
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin-bottom: 5px;
    }

    .page-title {
      margin: 0;
      color: var(--green-dark);
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .page-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-card {
      position: relative;
      border-radius: 27px;
      padding: 23px 20px 20px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96),
          rgba(255, 253, 248, 0.98)
        );
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 20px;
      color: var(--green-dark);
      font-size: 17px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .text-input,
    .date-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #FFFFFF;
      color: var(--text);
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .text-input {
      height: 50px;
      padding: 0 15px;
      font-size: 16px;
    }

    .text-input::placeholder {
      color: #A0A8A3;
    }

    .text-input:focus,
    .date-input:focus {
      border-color: rgba(94, 128, 107, 0.55);
      box-shadow: 0 0 0 4px rgba(94, 128, 107, 0.08);
    }

    /* 生日日期：文字放大、上下置中 */
    .date-input {
      min-height: 52px;
      padding: 0 14px;
      font-size: 18px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      color: var(--text);
    }

    .date-input::-webkit-date-and-time-value {
      text-align: left;
      min-height: 1.4em;
      display: flex;
      align-items: center;
    }

    .date-input::-webkit-datetime-edit {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .date-input::-webkit-calendar-picker-indicator {
      opacity: 0.65;
      cursor: pointer;
    }

    .calendar-label {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 18px;
    }

    .age-box {
      min-height: 50px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-radius: 15px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 16px;
      font-weight: 800;
    }

    .support-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .support-button {
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #FFFFFF;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .support-button:active {
      transform: scale(0.98);
    }

    .support-button.active {
      border-color: transparent;
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .support-count {
      display: none;
      margin-top: 12px;
      padding: 12px 13px;
      border-radius: 15px;
      background: #FAF8F2;
      border: 1px solid var(--border);
    }

    .support-count.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .support-count-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .counter-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 20px;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
    }

    .count-input {
      width: 50px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--green-dark);
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      outline: none;
    }

    .count-input:focus {
      border-color: rgba(94, 128, 107, 0.55);
      box-shadow: 0 0 0 4px rgba(94, 128, 107, 0.08);
    }

    .count-unit {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .validation-hint,
    .validation-error {
      display: none;
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.4;
    }

    .validation-hint {
      color: var(--muted);
    }

    .validation-error {
      color: #B7654F;
      font-weight: 700;
    }

    .validation-hint.show,
    .validation-error.show {
      display: block;
    }

    .input-error {
      border-color: #C9826B !important;
      box-shadow:
        0 0 0 4px rgba(201, 130, 107, 0.08) !important;
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .nav-button {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      transition: transform 0.15s ease;
    }

    .nav-button:active {
      transform: scale(0.98);
    }

    .back-button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
    }

    .next-button {
      background: var(--green-dark);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(41, 72, 59, 0.16);
    }

    footer {
      margin-top: auto;
      padding-top: 15px;
      text-align: center;
      color: #9AA39D;
      font-size: 11px;
    }

    @media (max-width: 430px) {
      .container {
        padding: 20px 16px 9px;
      }

      .brand {
        margin-bottom: 21px;
      }

      .page-title {
        font-size: 26px;
      }

      .form-card {
        padding: 21px 17px 18px;
        border-radius: 24px;
      }

      .section-title {
        margin-bottom: 18px;
      }

      .field {
        margin-bottom: 16px;
      }

      .navigation {
        gap: 9px;
      }
    }

    @media (max-height: 700px) {
      .container {
        padding-top: 15px;
      }

      .brand {
        margin-bottom: 15px;
      }

      .page-heading {
        margin-bottom: 12px;
      }

      .field {
        margin-bottom: 13px;
      }

      .form-card {
        padding-top: 18px;
        padding-bottom: 16px;
      }

      .navigation {
        margin-top: 12px;
      }

      footer {
        padding-top: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>
    <div class="decor decor-3"></div>

    <main class="container">

      <div class="brand">
        自由倒數｜試算工具
      </div>

      <section class="page-heading">
        <div class="page-number">01</div>
        <h1 class="page-title">基本資料</h1>
        <p class="page-subtitle">輸入基本資料，開始探索你的未來</p>
      </section>

      <section class="form-card">

        <h2 class="section-title">📍 你的起點</h2>

        <!-- 姓名 -->
        <div class="field">
          <label class="field-label" for="nickname">
            姓名／暱稱
          </label>

          <input
            type="text"
            id="nickname"
            class="text-input"
            placeholder="輸入你的名字或暱稱"
            maxlength="20"
            autocomplete="nickname"
          >

          <div id="nicknameHint" class="validation-hint">
            請輸入名字或暱稱
          </div>

          <div id="nicknameError" class="validation-error">
            ⚠️ 請先輸入姓名或暱稱
          </div>
        </div>

        <!-- 出生年月日 -->
        <div class="field">
          <label class="field-label" for="birthDate">
            出生年月日
          </label>

          <div class="input-wrap">
            <input
              type="date"
              id="birthDate"
              class="date-input"
              value="1994-01-01"
            >
            <span class="calendar-label">📅</span>
          </div>

          <div id="birthDateError" class="validation-error">
            ⚠️ 請先選擇出生年月日
          </div>
        </div>

        <!-- 年齡 -->
        <div class="field">
          <label class="field-label">
            目前年齡
          </label>

          <div class="age-box" id="ageDisplay">
            32 歲
          </div>
        </div>

        <!-- 撫養人數 -->
        <div class="field">
          <label class="field-label">
            目前需要撫養人數
          </label>

          <div class="support-buttons">
            <button
              type="button"
              class="support-button active"
              id="noSupport"
            >
              沒有
            </button>

            <button
              type="button"
              class="support-button"
              id="hasSupport"
            >
              有
            </button>
          </div>

          <div class="support-count" id="supportCountBox">
            <span class="support-count-label">
              需要撫養幾位？
            </span>

            <div class="counter">
              <button
                type="button"
                class="counter-button"
                id="minusButton"
                aria-label="減少撫養人數"
              >
                −
              </button>

              <input
                type="number"
                id="supportCount"
                class="count-input"
                min="1"
                max="20"
                step="1"
                value="1"
                inputmode="numeric"
              >

              <span class="count-unit">位</span>

              <button
                type="button"
                class="counter-button"
                id="plusButton"
                aria-label="增加撫養人數"
              >
                ＋
              </button>
            </div>

            <div
              id="supportCountError"
              class="validation-error"
            >
              ⚠️ 請輸入需要撫養的人數
            </div>
          </div>
        </div>

      </section>

      <nav class="navigation">

        <a
          class="nav-button back-button"
          href="index.html"
        >
          ← 回到首頁
        </a>

        <a
          id="nextButton"
          class="nav-button next-button"
          href="finance.html"
        >
          下一步 →
        </a>

      </nav>

      <footer>
        © 2026 TY Chen
      </footer>

    </main>
  </div>

  <script>
    const STORAGE_KEY = "freedomCountdownBasic";

    const nickname = document.getElementById("nickname");
    const birthDate = document.getElementById("birthDate");
    const ageDisplay = document.getElementById("ageDisplay");

    const noSupport = document.getElementById("noSupport");
    const hasSupport = document.getElementById("hasSupport");

    const supportCountBox =
      document.getElementById("supportCountBox");

    const countInput =
      document.getElementById("supportCount");

    const minusButton =
      document.getElementById("minusButton");

    const plusButton =
      document.getElementById("plusButton");

    const nextButton =
      document.getElementById("nextButton");

    const nicknameHint =
      document.getElementById("nicknameHint");

    const nicknameError =
      document.getElementById("nicknameError");

    const birthDateError =
      document.getElementById("birthDateError");

    const supportCountError =
      document.getElementById("supportCountError");


    /* -----------------------------
       年齡計算
    ----------------------------- */

    function calculateAge(dateString) {
      if (!dateString) {
        return "";
      }

      const birth = new Date(dateString + "T00:00:00");

      if (Number.isNaN(birth.getTime())) {
        return "";
      }

      const today = new Date();

      let age =
        today.getFullYear() -
        birth.getFullYear();

      const monthDifference =
        today.getMonth() -
        birth.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {
        age--;
      }

      return age;
    }


    function updateAge() {
      const age = calculateAge(birthDate.value);

      if (age === "") {
        ageDisplay.textContent = "請選擇生日";
        return;
      }

      ageDisplay.textContent = age + " 歲";
    }


    /* -----------------------------
       取得目前資料
    ----------------------------- */

    function getCurrentData() {
      const rawCount = countInput.value.trim();

      let supportCount = "";

      if (rawCount !== "") {
        const number = Number(rawCount);

        if (
          Number.isInteger(number) &&
          number >= 1 &&
          number <= 20
        ) {
          supportCount = number;
        }
      }

      return {
        nickname: nickname.value.trim(),
        birthDate: birthDate.value,
        hasSupport: hasSupport.classList.contains("active"),
        supportCount: supportCount
      };
    }


    /* -----------------------------
       自動保存
    ----------------------------- */

    function saveData() {
      const data = getCurrentData();

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );
    }


    /* -----------------------------
       載入已保存資料
    ----------------------------- */

    function loadData() {
      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        updateAge();
        return;
      }

      try {
        const data = JSON.parse(saved);

        if (typeof data.nickname === "string") {
          nickname.value = data.nickname;
        }

        if (data.birthDate) {
          birthDate.value = data.birthDate;
        }

        if (data.hasSupport === true) {
          hasSupport.classList.add("active");
          noSupport.classList.remove("active");
          supportCountBox.classList.add("show");
        } else {
          noSupport.classList.add("active");
          hasSupport.classList.remove("active");
          supportCountBox.classList.remove("show");
        }

        if (
          Number.isInteger(data.supportCount) &&
          data.supportCount >= 1 &&
          data.supportCount <= 20
        ) {
          countInput.value = data.supportCount;
        } else {
          countInput.value = 1;
        }

      } catch (error) {
        console.log("資料讀取失敗");
      }

      updateAge();
    }


    /* -----------------------------
       錯誤提示
    ----------------------------- */

    function clearNicknameError() {
      nicknameHint.classList.remove("show");
      nicknameError.classList.remove("show");
      nickname.classList.remove("input-error");
    }


    function showNicknameError() {
      nicknameHint.classList.add("show");
      nicknameError.classList.add("show");
      nickname.classList.add("input-error");
    }


    function clearBirthDateError() {
      birthDateError.classList.remove("show");
      birthDate.classList.remove("input-error");
    }


    function showBirthDateError() {
      birthDateError.classList.add("show");
      birthDate.classList.add("input-error");
    }


    function clearSupportCountError() {
      supportCountError.classList.remove("show");
      countInput.classList.remove("input-error");
    }


    function showSupportCountError() {
      supportCountError.classList.add("show");
      countInput.classList.add("input-error");
    }


    /* -----------------------------
       表單驗證
    ----------------------------- */

    function validateForm() {
      let valid = true;

      /* 姓名 */
      if (!nickname.value.trim()) {
        showNicknameError();
        valid = false;
      } else {
        clearNicknameError();
      }


      /* 生日 */
      if (!birthDate.value.trim()) {
        showBirthDateError();
        valid = false;
      } else {
        clearBirthDateError();
      }


      /* 撫養人數 */
      if (hasSupport.classList.contains("active")) {

        const rawCount =
          countInput.value.trim();

        const count =
          Number(rawCount);

        if (
          rawCount === "" ||
          !Number.isInteger(count) ||
          count < 1 ||
          count > 20
        ) {
          showSupportCountError();
          valid = false;
        } else {
          clearSupportCountError();
        }

      } else {
        clearSupportCountError();
      }

      return valid;
    }


    /* -----------------------------
       姓名輸入
    ----------------------------- */

    nickname.addEventListener("input", function () {
      clearNicknameError();
      saveData();
    });


    /* -----------------------------
       生日
    ----------------------------- */

    birthDate.addEventListener("change", function () {
      clearBirthDateError();
      updateAge();
      saveData();
    });


    /* -----------------------------
       撫養人數選擇
    ----------------------------- */

    noSupport.addEventListener("click", function () {

      noSupport.classList.add("active");
      hasSupport.classList.remove("active");

      supportCountBox.classList.remove("show");

      clearSupportCountError();

      saveData();
    });


    hasSupport.addEventListener("click", function () {

      hasSupport.classList.add("active");
      noSupport.classList.remove("active");

      supportCountBox.classList.add("show");

      if (
        !countInput.value ||
        Number(countInput.value) < 1
      ) {
        countInput.value = 1;
      }

      clearSupportCountError();

      saveData();
    });


    /* -----------------------------
       撫養人數
    ----------------------------- */

    function setSupportCount(value) {
      let number = Number(value);

      if (!Number.isFinite(number)) {
        number = 1;
      }

      number = Math.round(number);

      if (number < 1) {
        number = 1;
      }

      if (number > 20) {
        number = 20;
      }

      countInput.value = number;

      clearSupportCountError();

      saveData();
    }


    minusButton.addEventListener("click", function () {
      setSupportCount(
        Number(countInput.value || 1) - 1
      );
    });


    plusButton.addEventListener("click", function () {
      setSupportCount(
        Number(countInput.value || 1) + 1
      );
    });


    countInput.addEventListener("input", function () {
      clearSupportCountError();
      saveData();
    });


    countInput.addEventListener("change", function () {

      const raw =
        countInput.value.trim();

      if (raw === "") {
        saveData();
        return;
      }

      const number = Number(raw);

      if (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= 20
      ) {
        countInput.value = number;
      }

      saveData();
    });


    /* -----------------------------
       下一步
    ----------------------------- */

    nextButton.addEventListener("click", function (event) {

      /*
        先保存目前資料，
        即使驗證失敗也不會清掉已輸入內容
      */
      saveData();

      if (!validateForm()) {

        event.preventDefault();

        const firstError =
          document.querySelector(".input-error");

        if (firstError) {

          firstError.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

          setTimeout(function () {
            firstError.focus();
          }, 250);
        }

        return;
      }

      saveData();
    });


    /* -----------------------------
       初始化
    ----------------------------- */

    loadData();
  </script>
</body>
</html>
