<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基本資料｜自由倒數｜試算工具</title>
  <style>
    :root {
      --bg: #F6F2E9;
      --paper: #FFFDF8;
      --green-dark: #29483B;
      --green: #5E806B;
      --green-soft: #E4EEE7;
      --peach-soft: #F5E7D9;
      --peach-text: #9A6E4D;
      --gold-soft: #F2EBD5;
      --gold-text: #8B7540;
      --text: #2D3934;
      --muted: #748078;
      --border: rgba(83, 111, 97, 0.14);
      --shadow:
        0 10px 30px rgba(65, 77, 69, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top left,
          rgba(228, 238, 231, 0.65),
          transparent 32%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(245, 231, 217, 0.5),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }
    .page {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }
    /* ===== Header ===== */
    .header {
      margin-bottom: 24px;
    }
    .brand {
      color: var(--green-dark);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    .step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 12px 0 6px;
      color: var(--green-dark);
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    /* ===== Card ===== */
    .card {
      padding: 24px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(83, 111, 97, 0.1);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .section-title {
      margin-bottom: 22px;
      color: var(--green-dark);
      font-size: 18px;
      font-weight: 800;
    }
    /* ===== Field ===== */
    .field {
      margin-bottom: 24px;
    }
    .field:last-child {
      margin-bottom: 0;
    }
    .field-label {
      display: block;
      margin-bottom: 9px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }
    .text-input {
      display: block;
      width: 100%;
      height: 51px;
      padding: 0 16px;
      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 17px;
      background: #F9FAF6;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      outline: none;
      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }
    .text-input:focus {
      border-color: rgba(94, 128, 107, 0.5);
      background: #FFFFFF;
      box-shadow:
        0 0 0 3px rgba(94, 128, 107, 0.08);
    }
    .text-input::placeholder {
      color: #A5ADA8;
      font-weight: 500;
    }
    /* ===== Birth Date ===== */
    .birth-wrapper {
      position: relative;
      width: 100%;
      height: 51px;
      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 17px;
      background: #F9FAF6;
      overflow: hidden;
      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }
    /*
      日期＋📆 做成同一組
      整組一起置中
    */
    .birth-display {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      z-index: 1;
    }
    .birth-calendar-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      pointer-events: none;
    }
    /*
      真正的 date input
      覆蓋整個欄位，負責叫出手機原生日期選擇器
    */
    .birth-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      opacity: 0.01;
      cursor: pointer;
      z-index: 2;
    }
    .birth-wrapper:focus-within {
      border-color: rgba(94, 128, 107, 0.5);
      background: #FFFFFF;
      box-shadow:
        0 0 0 3px rgba(94, 128, 107, 0.08);
    }
    .birth-wrapper.input-error {
      border-color: #C9826B !important;
      box-shadow:
        0 0 0 3px rgba(201, 130, 107, 0.08) !important;
    }
    /* ===== Validation ===== */
    .validation-message {
      display: none;
      margin-top: 7px;
      color: #B66D58;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 600;
    }
    .validation-message.show {
      display: block;
    }
    .input-error {
      border-color: #C9826B !important;
      box-shadow:
        0 0 0 3px rgba(201, 130, 107, 0.08) !important;
    }
    /* ===== Age Box ===== */
    .age-box {
      margin-top: 14px;
      padding: 16px;
      border-radius: 17px;
      background: var(--gold-soft);
      text-align: center;
    }
    .age-label {
      margin-bottom: 4px;
      color: var(--gold-text);
      font-size: 12px;
      font-weight: 700;
    }
    .age-number {
      color: var(--green-dark);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }
    /* ===== Support ===== */
    .support-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .support-button {
      height: 51px;
      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 17px;
      background: #F9FAF6;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease,
        transform .12s ease;
    }
    .support-button:active {
      transform: scale(0.98);
    }
    .support-button.active {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
    }
    .support-count {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-radius: 17px;
      background: #F9FAF6;
      border: 1px solid rgba(83, 111, 97, 0.1);
    }
    .support-count.show {
      display: block;
    }
    .count-title {
      margin-bottom: 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }
    .count-control {
      display: flex;
      align-items: center;
      width: 100%;
      height: 48px;
      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 15px;
      background: #FFFFFF;
      overflow: hidden;
    }
    .count-button {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border: 0;
      background: transparent;
      color: var(--green-dark);
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .count-input {
      min-width: 0;
      flex: 1;
      height: 48px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }
    /* ===== Bottom Navigation ===== */
    .bottom-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }
    .nav-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      border-radius: 17px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition:
        transform .12s ease,
        opacity .18s ease;
    }
    .nav-button:active {
      transform: scale(0.98);
    }
    .nav-back {
      border: 1px solid rgba(83, 111, 97, 0.16);
      background: rgba(255, 253, 248, 0.85);
      color: var(--green-dark);
    }
    .nav-next {
      border: 1px solid var(--green);
      background: var(--green);
      color: #FFFFFF;
    }
    /* ===== Footer ===== */
    .footer {
      margin-top: 24px;
      color: #9AA39E;
      text-align: center;
      font-size: 11px;
    }
    /* ===== Mobile ===== */
    @media (max-width: 380px) {
      .page {
        width: min(720px, calc(100% - 24px));
        padding-top: 18px;
      }
      .card {
        padding: 20px 18px;
        border-radius: 21px;
      }
      .text-input,
      .birth-wrapper {
        height: 48px;
        border-radius: 15px;
      }
      .birth-display {
        font-size: 21px;
        gap: 4px;
      }
      .birth-calendar-icon {
        font-size: 21px;
      }
      .birth-input {
        height: 48px;
      }
      .support-button {
        height: 48px;
        border-radius: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- ===== Header ===== -->
    <header class="header">
      <div class="brand">
        自由倒數｜試算工具
      </div>
      <div class="step">
        STEP 01
      </div>
      <h1>
        基本資料
      </h1>
      <p class="subtitle">
        輸入基本資料，開始探索你的未來
      </p>
    </header>
    <!-- ===== Main Card ===== -->
    <section class="card">
      <div class="section-title">
        📍 你的起點
      </div>
      <!-- ===== 姓名／暱稱 ===== -->
      <div class="field">
        <label
          class="field-label"
          for="nickname"
        >
          姓名／暱稱
        </label>
        <input
          id="nickname"
          class="text-input"
          type="text"
          placeholder="輸入你的姓名或暱稱"
          autocomplete="name"
        >
        <div
          id="nicknameError"
          class="validation-message"
        >
          ⚠️ 請先輸入姓名／暱稱
        </div>
      </div>
      <!-- ===== 出生年月日 ===== -->
      <div class="field">
        <label
          class="field-label"
          for="birthDate"
        >
          出生年月日
        </label>
        <div
          class="birth-wrapper"
          id="birthWrapper"
        >
          <div
            id="birthDateDisplay"
            class="birth-display"
          >
            <span>1994 / 01 / 01</span>
            <span
              class="birth-calendar-icon"
              aria-hidden="true"
            >
              📆
            </span>
          </div>
          <input
            id="birthDate"
            class="birth-input"
            type="date"
            value="1994-01-01"
            aria-label="出生年月日"
          >
        </div>
        <div
          id="birthDateError"
          class="validation-message"
        >
          ⚠️ 請先選擇出生年月日
        </div>
        <div class="age-box">
          <div class="age-label">
            目前年齡
          </div>
          <div
            id="ageNumber"
            class="age-number"
          >
            32 歲
          </div>
        </div>
      </div>
      <!-- ===== 撫養人數 ===== -->
      <div class="field">
        <label class="field-label">
          是否有需要撫養的人？
        </label>
        <div class="support-options">
          <button
            type="button"
            id="noSupport"
            class="support-button active"
          >
            沒有
          </button>
          <button
            type="button"
            id="hasSupport"
            class="support-button"
          >
            有
          </button>
        </div>
        <div
          id="supportCount"
          class="support-count"
        >
          <div class="count-title">
            需要撫養幾人？
          </div>
          <div class="count-control">
            <button
              type="button"
              id="minusButton"
              class="count-button"
              aria-label="減少撫養人數"
            >
              −
            </button>
            <input
              id="countInput"
              class="count-input"
              type="number"
              min="1"
              max="20"
              value="1"
              inputmode="numeric"
            >
            <button
              type="button"
              id="plusButton"
              class="count-button"
              aria-label="增加撫養人數"
            >
              ＋
            </button>
          </div>
          <div
            id="supportCountError"
            class="validation-message"
          >
            ⚠️ 請輸入 1～20 人
          </div>
        </div>
      </div>
    </section>
    <!-- ===== Navigation ===== -->
    <nav class="bottom-nav">
      <a
        class="nav-button nav-back"
        href="index.html"
      >
        ← 回到首頁
      </a>
      <a
        class="nav-button nav-next"
        href="finance.html"
        id="nextButton"
      >
        下一步 →
      </a>
    </nav>
    <footer class="footer">
      © 2026 TY Chen
    </footer>
  </main>
  <script>
    /* ===== Storage ===== */
    const STORAGE_KEY = "freedomCountdownBasic";
    /* ===== Elements ===== */
    const nickname =
      document.getElementById("nickname");
    const birthDate =
      document.getElementById("birthDate");
    const birthWrapper =
      document.getElementById("birthWrapper");
    const birthDateDisplay =
      document.getElementById("birthDateDisplay");
    const ageNumber =
      document.getElementById("ageNumber");
    const noSupport =
      document.getElementById("noSupport");
    const hasSupport =
      document.getElementById("hasSupport");
    const supportCount =
      document.getElementById("supportCount");
    const countInput =
      document.getElementById("countInput");
    const minusButton =
      document.getElementById("minusButton");
    const plusButton =
      document.getElementById("plusButton");
    const nextButton =
      document.getElementById("nextButton");
    const nicknameError =
      document.getElementById("nicknameError");
    const birthDateError =
      document.getElementById("birthDateError");
    const supportCountError =
      document.getElementById("supportCountError");
    /* ===== 出生日期顯示 ===== */
    function formatBirthDate(dateString) {
      if (!dateString) {
        return "選擇出生年月日";
      }
      const parts =
        dateString.split("-");
      if (parts.length !== 3) {
        return "選擇出生年月日";
      }
      return `${parts[0]} / ${parts[1]} / ${parts[2]}`;
    }
    function updateBirthDateDisplay() {
      const displayText =
        formatBirthDate(birthDate.value);
      birthDateDisplay.innerHTML = `
        <span>${displayText}</span>
        <span
          class="birth-calendar-icon"
          aria-hidden="true"
        >
          📆
        </span>
      `;
    }
    /* ===== 年齡計算 ===== */
    function calculateAge(dateString) {
      if (!dateString) {
        return null;
      }
      const birth =
        new Date(dateString + "T00:00:00");
      if (Number.isNaN(birth.getTime())) {
        return null;
      }
      const today =
        new Date();
      let age =
        today.getFullYear() -
        birth.getFullYear();
      const monthDifference =
        today.getMonth() -
        birth.getMonth();
      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {
        age--;
      }
      return age;
    }
    function updateAge() {
      const age =
        calculateAge(birthDate.value);
      if (
        age === null ||
        age < 0 ||
        age > 120
      ) {
        ageNumber.textContent = "—";
        return;
      }
      ageNumber.textContent =
        age + " 歲";
    }
    /* ===== Data ===== */
    function getCurrentData() {
      const count =
        parseInt(countInput.value, 10);
      return {
        nickname:
          nickname.value.trim(),
        birthDate:
          birthDate.value,
        hasSupport:
          hasSupport.classList.contains("active"),
        supportCount:
          hasSupport.classList.contains("active") &&
          Number.isInteger(count) &&
          count >= 1 &&
          count <= 20
            ? count
            : ""
      };
    }
    function saveData() {
      const data =
        getCurrentData();
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );
    }
    function loadData() {
      const saved =
        localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        updateBirthDateDisplay();
        updateAge();
        return;
      }
      try {
        const data =
          JSON.parse(saved);
        /* 暱稱 */
        if (typeof data.nickname === "string") {
          nickname.value =
            data.nickname;
        }
        /* 出生日期 */
        if (typeof data.birthDate === "string") {
          birthDate.value =
            data.birthDate;
        }
        /* 撫養狀態 */
        if (data.hasSupport) {
          hasSupport.classList.add("active");
          noSupport.classList.remove("active");
          supportCount.classList.add("show");
        } else {
          noSupport.classList.add("active");
          hasSupport.classList.remove("active");
          supportCount.classList.remove("show");
        }
        /* 撫養人數 */
        if (
          Number.isInteger(data.supportCount) &&
          data.supportCount >= 1 &&
          data.supportCount <= 20
        ) {
          countInput.value =
            data.supportCount;
        }
      } catch (error) {
        console.warn(
          "讀取基本資料失敗",
          error
        );
      }
      updateBirthDateDisplay();
      updateAge();
    }
    /* ===== Error ===== */
    function clearNicknameError() {
      nicknameError.classList.remove("show");
      nickname.classList.remove("input-error");
    }
    function clearBirthDateError() {
      birthDateError.classList.remove("show");
      birthWrapper.classList.remove("input-error");
    }
    function clearSupportCountError() {
      supportCountError.classList.remove("show");
      countInput.classList.remove("input-error");
    }
    /* ===== Validate ===== */
    function validateForm() {
      let valid = true;
      /* 暱稱 */
      if (!nickname.value.trim()) {
        nicknameError.classList.add("show");
        nickname.classList.add("input-error");
        valid = false;
      } else {
        clearNicknameError();
      }
      /* 出生年月日 */
      if (!birthDate.value) {
        birthDateError.classList.add("show");
        birthWrapper.classList.add("input-error");
        valid = false;
      } else {
        clearBirthDateError();
      }
      /* 撫養人數 */
      if (
        hasSupport.classList.contains("active")
      ) {
        const count =
          parseInt(countInput.value, 10);
        if (
          !Number.isInteger(count) ||
          count < 1 ||
          count > 20
        ) {
          supportCountError.classList.add("show");
          countInput.classList.add("input-error");
          valid = false;
        } else {
          clearSupportCountError();
        }
      } else {
        clearSupportCountError();
      }
      return valid;
    }
    /* ===== Events ===== */
    nickname.addEventListener(
      "input",
      () => {
        clearNicknameError();
        saveData();
      }
    );
    birthDate.addEventListener(
      "change",
      () => {
        updateBirthDateDisplay();
        updateAge();
        clearBirthDateError();
        saveData();
      }
    );
    noSupport.addEventListener(
      "click",
      () => {
        noSupport.classList.add("active");
        hasSupport.classList.remove("active");
        supportCount.classList.remove("show");
        clearSupportCountError();
        saveData();
      }
    );
    hasSupport.addEventListener(
      "click",
      () => {
        hasSupport.classList.add("active");
        noSupport.classList.remove("active");
        supportCount.classList.add("show");
        saveData();
      }
    );
    minusButton.addEventListener(
      "click",
      () => {
        let value =
          parseInt(countInput.value, 10) || 1;
        value =
          Math.max(1, value - 1);
        countInput.value =
          value;
        clearSupportCountError();
        saveData();
      }
    );
    plusButton.addEventListener(
      "click",
      () => {
        let value =
          parseInt(countInput.value, 10) || 1;
        value =
          Math.min(20, value + 1);
        countInput.value =
          value;
        clearSupportCountError();
        saveData();
      }
    );
    countInput.addEventListener(
      "input",
      () => {
        clearSupportCountError();
        saveData();
      }
    );
    countInput.addEventListener(
      "change",
      () => {
        let value =
          parseInt(countInput.value, 10);
        if (Number.isNaN(value)) {
          value = 1;
        }
        value =
          Math.max(1, Math.min(20, value));
        countInput.value =
          value;
        clearSupportCountError();
        saveData();
      }
    );
    nextButton.addEventListener(
      "click",
      (event) => {
        const valid =
          validateForm();
        if (!valid) {
          event.preventDefault();
          const firstError =
            document.querySelector(
              ".input-error"
            );
          if (firstError) {
            firstError.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });
            setTimeout(() => {
              if (
                firstError === birthWrapper
              ) {
                birthDate.focus();
              } else if (
                typeof firstError.focus === "function"
              ) {
                firstError.focus();
              }
            }, 250);
          }
          return;
        }
        saveData();
      }
    );
    /* ===== 初始化 ===== */
    loadData();
  </script>
</body>
</html>
