<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#F6F2E9">
  <meta name="description" content="自由倒數｜基本資料">

  <title>自由倒數｜基本資料</title>

  <style>
    :root {
      --bg: #F6F2E9;
      --paper: #FFFDF8;

      --green-dark: #29483B;
      --green: #5E806B;
      --green-soft: #E4EEE7;

      --peach-soft: #F5E7D9;
      --peach-text: #9A6E4D;

      --gold-soft: #F2EBD5;
      --gold-text: #8B7540;

      --text: #2D3934;
      --muted: #748078;

      --border: rgba(83, 111, 97, 0.14);

      --shadow:
        0 16px 38px rgba(59, 76, 67, 0.09),
        0 3px 10px rgba(59, 76, 67, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(228, 238, 231, 0.75),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .decor {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .decor-1 {
      width: 180px;
      height: 180px;
      background: rgba(228, 238, 231, 0.42);
      top: -75px;
      right: -65px;
    }

    .decor-2 {
      width: 95px;
      height: 95px;
      background: rgba(245, 231, 217, 0.45);
      top: 270px;
      left: -50px;
    }

    .decor-3 {
      width: 120px;
      height: 120px;
      background: rgba(242, 235, 213, 0.42);
      bottom: 70px;
      right: -55px;
    }

    .container {
      position: relative;
      z-index: 1;

      width: 100%;
      max-width: 720px;
      min-height: 100vh;

      margin: 0 auto;
      padding: 22px 18px 10px;

      display: flex;
      flex-direction: column;
    }

    .brand {
      text-align: center;
      color: var(--green-dark);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 20px;
    }

    .page-number {
      display: block;
      color: var(--green);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.12em;
      margin-bottom: 2px;
    }

    .page-title {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .page-subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-card {
      width: 100%;

      background:
        linear-gradient(
          180deg,
          rgba(255, 253, 248, 0.98),
          rgba(255, 253, 248, 0.94)
        );

      border: 1px solid var(--border);
      border-radius: 27px;
      box-shadow: var(--shadow);

      padding: 24px 20px 20px;
    }

    .section-title {
      color: var(--green-dark);
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 22px;
    }

    .field-label {
      display: block;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 9px;
    }

    .text-input,
    .birth-date {
      width: 100%;
      height: 52px;

      padding: 0 16px;

      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 15px;

      background: #FFFFFF;

      color: var(--text);
      font-size: 16px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .text-input::placeholder {
      color: #A0AAA4;
    }

    .text-input:focus,
    .birth-date:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(94, 128, 107, 0.10);
    }

    .input-error {
      border-color: #C9826B !important;
      box-shadow: 0 0 0 4px rgba(201, 130, 107, 0.09) !important;
    }

    .field-hint {
      display: none;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .field-hint.show {
      display: block;
    }

    .error-message {
      display: none;
      margin-top: 6px;
      color: #B7654F;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .error-message.show {
      display: block;
    }

    .birth-date-wrap {
      position: relative;
    }

    .birth-date {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 52px;
    }

    .date-icon {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);

      font-size: 20px;
      pointer-events: none;
    }

    .age-box {
      margin-top: 10px;

      min-height: 88px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px 18px;

      background: var(--green-soft);
      border-radius: 18px;
    }

    .age-label {
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 800;
    }

    .age-value {
      color: var(--green-dark);
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
    }

    .age-unit {
      font-size: 15px;
      margin-left: 3px;
      font-weight: 800;
    }

    .choice-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choice-button {
      min-height: 50px;

      border: 1px solid rgba(83, 111, 97, 0.16);
      border-radius: 15px;

      background: #FFFFFF;
      color: var(--muted);

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.1s ease;
    }

    .choice-button:active {
      transform: scale(0.98);
    }

    .choice-button.active {
      background: var(--green-soft);
      color: var(--green-dark);
      border-color: rgba(94, 128, 107, 0.28);
    }

    .support-count {
      display: none;
      margin-top: 13px;
    }

    .support-count.show {
      display: block;
    }

    .count-control {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 8px;
      align-items: center;
    }

    .count-button {
      height: 48px;

      border: 1px solid rgba(83, 111, 97, 0.16);
      border-radius: 14px;

      background: var(--green-soft);
      color: var(--green-dark);

      font-size: 23px;
      font-weight: 800;

      cursor: pointer;
    }

    .count-input {
      width: 100%;
      height: 48px;

      border: 1px solid rgba(83, 111, 97, 0.18);
      border-radius: 14px;

      background: #FFFFFF;

      color: var(--green-dark);

      text-align: center;

      font-size: 18px;
      font-weight: 800;

      outline: none;
    }

    .count-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(94, 128, 107, 0.10);
    }

    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 16px;
    }

    .nav-button {
      min-height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 17px;

      text-decoration: none;

      font-size: 15px;
      font-weight: 800;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .nav-button:active {
      transform: scale(0.98);
    }

    .nav-back {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(83, 111, 97, 0.15);
      color: var(--green-dark);
    }

    .nav-next {
      background: var(--green);
      color: #FFFFFF;
      border: 1px solid var(--green);
      box-shadow: 0 8px 18px rgba(94, 128, 107, 0.16);
    }

    .footer {
      margin-top: auto;
      padding-top: 18px;

      text-align: center;

      color: #9AA29D;
      font-size: 12px;
    }

    @media (min-width: 600px) {
      .container {
        padding-top: 34px;
      }

      .form-card {
        padding: 30px 28px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>
    <div class="decor decor-3"></div>

    <main class="container">

      <div class="brand">
        自由倒數｜試算工具
      </div>

      <header class="page-heading">
        <span class="page-number">01</span>

        <h1 class="page-title">
          基本資料
        </h1>

        <p class="page-subtitle">
          輸入你的基本資料，開始探索你的未來
        </p>
      </header>

      <section class="form-card">

        <div class="section-title">
          📍 你的起點
        </div>

        <!-- 姓名 -->
        <div class="field">

          <label
            class="field-label"
            for="nickname"
          >
            姓名／暱稱
          </label>

          <input
            id="nickname"
            class="text-input"
            type="text"
            maxlength="20"
            placeholder="輸入你的名字或暱稱"
            autocomplete="name"
          >

          <div
            id="nicknameHint"
            class="field-hint"
          >
            請輸入名字或暱稱
          </div>

          <div
            id="nicknameError"
            class="error-message"
            aria-live="polite"
          >
            ⚠️ 請先輸入姓名或暱稱
          </div>

        </div>


        <!-- 出生日期 -->
        <div class="field">

          <label
            class="field-label"
            for="birthDate"
          >
            出生年月日
          </label>

          <div class="birth-date-wrap">

            <input
              id="birthDate"
              class="birth-date"
              type="date"
              value="1994-01-01"
            >

            <span class="date-icon">
              📅
            </span>

          </div>

          <div
            id="birthDateError"
            class="error-message"
            aria-live="polite"
          >
            ⚠️ 請先選擇出生年月日
          </div>

        </div>


        <!-- 年齡 -->
        <div class="field">

          <div class="age-box">

            <div class="age-label">
              目前年齡
            </div>

            <div>
              <span
                id="ageValue"
                class="age-value"
              >
                32
              </span>

              <span class="age-unit">
                歲
              </span>
            </div>

          </div>

        </div>


        <!-- 撫養人數 -->
        <div class="field">

          <label class="field-label">
            目前需要撫養人數
          </label>

          <div class="choice-group">

            <button
              type="button"
              id="supportNo"
              class="choice-button active"
            >
              沒有
            </button>

            <button
              type="button"
              id="supportYes"
              class="choice-button"
            >
              有
            </button>

          </div>


          <div
            id="supportCount"
            class="support-count"
          >

            <label
              class="field-label"
              for="supportCountInput"
              style="margin-top: 14px;"
            >
              需要撫養幾位？
            </label>

            <div class="count-control">

              <button
                type="button"
                id="countMinus"
                class="count-button"
                aria-label="減少撫養人數"
              >
                −
              </button>

              <input
                id="supportCountInput"
                class="count-input"
                type="number"
                min="1"
                max="20"
                inputmode="numeric"
                value="1"
                aria-label="需要撫養幾位"
              >

              <button
                type="button"
                id="countPlus"
                class="count-button"
                aria-label="增加撫養人數"
              >
                ＋
              </button>

            </div>

            <div
              id="supportCountError"
              class="error-message"
              aria-live="polite"
            >
              ⚠️ 請輸入需要撫養的人數
            </div>

          </div>

        </div>

      </section>


      <!-- 底部導航 -->
      <div class="navigation">

        <a
          href="index.html"
          class="nav-button nav-back"
        >
          ← 回到首頁
        </a>

        <a
          href="finance.html"
          id="nextButton"
          class="nav-button nav-next"
        >
          下一步 →
        </a>

      </div>


      <footer class="footer">
        © 2026 TY Chen
      </footer>

    </main>

  </div>


  <script>
    const STORAGE_KEY = "freedomCountdownBasic";

    const nicknameInput = document.getElementById("nickname");
    const birthDateInput = document.getElementById("birthDate");

    const ageValue = document.getElementById("ageValue");

    const supportNo = document.getElementById("supportNo");
    const supportYes = document.getElementById("supportYes");

    const supportCount = document.getElementById("supportCount");
    const supportCountInput = document.getElementById("supportCountInput");

    const countMinus = document.getElementById("countMinus");
    const countPlus = document.getElementById("countPlus");

    const nextButton = document.getElementById("nextButton");

    const nicknameHint = document.getElementById("nicknameHint");
    const nicknameError = document.getElementById("nicknameError");

    const birthDateError = document.getElementById("birthDateError");

    const supportCountError = document.getElementById("supportCountError");


    /* =========================
       計算目前年齡
    ========================= */

    function calculateAge(birthDate) {

      if (!birthDate) {
        return "";
      }

      const birth = new Date(birthDate + "T00:00:00");

      if (Number.isNaN(birth.getTime())) {
        return "";
      }

      const today = new Date();

      let age =
        today.getFullYear() -
        birth.getFullYear();

      const monthDifference =
        today.getMonth() -
        birth.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {
        age--;
      }

      return age >= 0 ? age : "";
    }


    function updateAge() {

      const age = calculateAge(
        birthDateInput.value
      );

      ageValue.textContent =
        age === "" ? "—" : age;

    }


    /* =========================
       取得目前資料
    ========================= */

    function getCurrentData() {

      const rawCount =
        supportCountInput.value.trim();

      let parsedCount = "";

      if (rawCount !== "") {

        const number =
          Number(rawCount);

        if (
          Number.isInteger(number) &&
          number >= 1 &&
          number <= 20
        ) {
          parsedCount = number;
        }
      }

      return {

        nickname:
          nicknameInput.value.trim(),

        birthDate:
          birthDateInput.value,

        hasSupport:
          supportYes.classList.contains("active"),

        supportCount:
          parsedCount

      };
    }


    /* =========================
       自動保存
    ========================= */

    function saveData() {

      const data =
        getCurrentData();

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    }


    /* =========================
       載入已保存資料
    ========================= */

    function loadData() {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {

        updateAge();

        return;
      }

      try {

        const data =
          JSON.parse(saved);


        if (
          typeof data.nickname === "string"
        ) {
          nicknameInput.value =
            data.nickname;
        }


        if (
          typeof data.birthDate === "string" &&
          data.birthDate !== ""
        ) {
          birthDateInput.value =
            data.birthDate;
        }


        if (data.hasSupport === true) {

          supportYes.classList.add("active");
          supportNo.classList.remove("active");

          supportCount.classList.add("show");

          if (
            Number.isInteger(data.supportCount) &&
            data.supportCount >= 1 &&
            data.supportCount <= 20
          ) {
            supportCountInput.value =
              data.supportCount;
          }

        } else {

          supportNo.classList.add("active");
          supportYes.classList.remove("active");

          supportCount.classList.remove("show");

        }


        updateAge();

      } catch (error) {

        console.log(
          "讀取基本資料失敗",
          error
        );

      }

    }


    /* =========================
       清除錯誤
    ========================= */

    function clearNicknameError() {

      nicknameInput.classList.remove(
        "input-error"
      );

      nicknameHint.classList.remove(
        "show"
      );

      nicknameError.classList.remove(
        "show"
      );

    }


    function clearBirthDateError() {

      birthDateInput.classList.remove(
        "input-error"
      );

      birthDateError.classList.remove(
        "show"
      );

    }


    function clearSupportCountError() {

      supportCountInput.classList.remove(
        "input-error"
      );

      supportCountError.classList.remove(
        "show"
      );

    }


    /* =========================
       驗證基本資料
    ========================= */

    function validateForm() {

      let valid = true;


      /*
       * 姓名／暱稱
       */

      if (
        nicknameInput.value.trim() === ""
      ) {

        nicknameInput.classList.add(
          "input-error"
        );

        nicknameHint.classList.add(
          "show"
        );

        nicknameError.classList.add(
          "show"
        );

        valid = false;

      } else {

        clearNicknameError();

      }


      /*
       * 出生年月日
       */

      if (
        birthDateInput.value.trim() === ""
      ) {

        birthDateInput.classList.add(
          "input-error"
        );

        birthDateError.classList.add(
          "show"
        );

        valid = false;

      } else {

        clearBirthDateError();

      }


      /*
       * 撫養人數
       *
       * 如果選擇「有」
       * 就一定要有有效數字
       */

      if (
        supportYes.classList.contains("active")
      ) {

        const count =
          Number(
            supportCountInput.value
          );

        if (
          supportCountInput.value.trim() === "" ||
          !Number.isInteger(count) ||
          count < 1 ||
          count > 20
        ) {

          supportCountInput.classList.add(
            "input-error"
          );

          supportCountError.classList.add(
            "show"
          );

          valid = false;

        } else {

          clearSupportCountError();

        }

      } else {

        clearSupportCountError();

      }


      return valid;

    }


    /* =========================
       姓名輸入
       輸入時立即保存
    ========================= */

    nicknameInput.addEventListener(
      "input",
      function () {

        clearNicknameError();

        saveData();

      }
    );


    /* =========================
       出生日期
       改變時立即保存
    ========================= */

    birthDateInput.addEventListener(
      "change",
      function () {

        clearBirthDateError();

        updateAge();

        saveData();

      }
    );


    /* =========================
       沒有撫養
    ========================= */

    supportNo.addEventListener(
      "click",
      function () {

        supportNo.classList.add("active");
        supportYes.classList.remove("active");

        supportCount.classList.remove("show");

        clearSupportCountError();

        saveData();

      }
    );


    /* =========================
       有撫養
    ========================= */

    supportYes.addEventListener(
      "click",
      function () {

        supportYes.classList.add("active");
        supportNo.classList.remove("active");

        supportCount.classList.add("show");

        clearSupportCountError();

        /*
         * 如果原本沒有數字
         * 自動給 1 位作為起始值
         */
        if (
          supportCountInput.value.trim() === ""
        ) {
          supportCountInput.value = "1";
        }

        saveData();

      }
    );


    /* =========================
       撫養人數－
    ========================= */

    countMinus.addEventListener(
      "click",
      function () {

        let count =
          Number(
            supportCountInput.value
          ) || 1;

        count =
          Math.max(
            1,
            count - 1
          );

        supportCountInput.value =
          count;

        clearSupportCountError();

        saveData();

      }
    );


    /* =========================
       撫養人數＋
    ========================= */

    countPlus.addEventListener(
      "click",
      function () {

        let count =
          Number(
            supportCountInput.value
          ) || 1;

        count =
          Math.min(
            20,
            count + 1
          );

        supportCountInput.value =
          count;

        clearSupportCountError();

        saveData();

      }
    );


    /* =========================
       直接輸入撫養人數
       改變時立即保存
    ========================= */

    supportCountInput.addEventListener(
      "input",
      function () {

        clearSupportCountError();

        saveData();

      }
    );


    supportCountInput.addEventListener(
      "change",
      function () {

        let count =
          Number(
            supportCountInput.value
          );

        if (
          Number.isInteger(count)
        ) {

          count =
            Math.max(
              1,
              Math.min(
                20,
                count
              )
            );

          supportCountInput.value =
            count;

        }

        clearSupportCountError();

        saveData();

      }
    );


    /* =========================
       下一步
    ========================= */

    nextButton.addEventListener(
      "click",
      function (event) {

        /*
         * 不管之前有沒有輸入，
         * 按下一步前都再次保存目前資料。
         */
        saveData();


        /*
         * 驗證不通過：
         * 阻止前往 finance.html
         */
        if (!validateForm()) {

          event.preventDefault();

          /*
           * 自動把畫面帶到第一個錯誤
           */
          const firstError =
            document.querySelector(
              ".input-error"
            );

          if (firstError) {

            firstError.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });

            setTimeout(
              function () {

                firstError.focus();

              },
              250
            );

          }

          return;

        }


        /*
         * 驗證成功
         * 再保存一次，然後正常前往 finance.html
         */
        saveData();

      }
    );
