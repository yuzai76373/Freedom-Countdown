/* ===== 出生年月日 ===== */

  /* ==================================================
   出生年月日
================================================== */
function formatBirthDate(dateString) {
  if (!dateString) {
    return "選擇出生年月日";
  }
  const parts = dateString.split("-");
  if (parts.length !== 3) {
    return "選擇出生年月日";
  }
  return `${parts[0]} / ${parts[1]} / ${parts[2]}`;
}
function updateBirthDateDisplay() {
  const displayText =
    formatBirthDate(birthDate.value);
  birthDateDisplay.innerHTML = `
    <span>${displayText}</span>
    <span
      class="birth-calendar-icon"
      aria-hidden="true"
    >📆</span>
  `;
}
/* ==================================================
   年齡
================================================== */
function calculateAge(dateString) {
  if (!dateString) {
    return null;
  }
  const birth =
    new Date(dateString + "T00:00:00");
  if (Number.isNaN(birth.getTime())) {
    return null;
  }
  const today =
    new Date();
  let age =
    today.getFullYear() -
    birth.getFullYear();
  const monthDifference =
    today.getMonth() -
    birth.getMonth();
  if (
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() < birth.getDate()
    )
  ) {
    age--;
  }
  return age;
}
function updateAge() {
  const age =
    calculateAge(birthDate.value);
  if (
    age === null ||
    age < 0 ||
    age > 120
  ) {
    ageNumber.textContent = "—";
    return;
  }
  ageNumber.textContent =
    age + " 歲";
}
    /* ==================================================
       取得目前資料
    ================================================== */
    function getCurrentData() {
      const rawCount =
        countInput.value.trim();
      let supportCountValue = "";
      if (
        rawCount !== ""
      ) {
        const number =
          Number(rawCount);
        if (
          Number.isInteger(number) &&
          number >= 1 &&
          number <= 20
        ) {
          supportCountValue = number;
        }
      }
      return {
        nickname:
          nickname.value.trim(),
        birthDate:
          birthDate.value,
        hasSupport:
          hasSupport.classList.contains("active"),
        supportCount:
          supportCountValue
      };
    }
    /* ==================================================
       無感自動保存
    ================================================== */
    function saveData() {
      const data =
        getCurrentData();
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );
    }
    /* ==================================================
       載入資料
    ================================================== */
    function loadData() {
      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );
      if (!saved) {
        updateAge();
        return;
      }
      try {
        const data =
          JSON.parse(saved);
        if (
          typeof data.nickname === "string"
        ) {
          nickname.value =
            data.nickname;
        }
        if (
          typeof data.birthDate === "string" &&
          data.birthDate
        ) {
          birthDate.value =
            data.birthDate;
        }
        if (
          data.hasSupport === true
        ) {
          hasSupport.classList.add("active");
          noSupport.classList.remove("active");
          supportCount.classList.add("show");
        } else {
          noSupport.classList.add("active");
          hasSupport.classList.remove("active");
          supportCount.classList.remove("show");
        }
        if (
          Number.isInteger(data.supportCount) &&
          data.supportCount >= 1 &&
          data.supportCount <= 20
        ) {
          countInput.value =
            data.supportCount;
        } else {
          countInput.value = 1;
        }
      } catch (error) {
        console.log(
          "基本資料讀取失敗"
        );
      }
      updateAge();
    }
    /* ==================================================
       清除錯誤
    ================================================== */
    function clearNicknameError() {
      nicknameError.classList.remove("show");
      nickname.classList.remove("input-error");
    }
    function clearBirthDateError() {
      birthDateError.classList.remove("show");
      birthDate.classList.remove("input-error");
    }
    function clearSupportCountError() {
      supportCountError.classList.remove("show");
      countInput.classList.remove("input-error");
    }
    /* ==================================================
       驗證
    ================================================== */
    function validateForm() {
      let valid = true;
      /* 姓名 */
      if (
        !nickname.value.trim()
      ) {
        nicknameError.classList.add("show");
        nickname.classList.add("input-error");
        valid = false;
      } else {
        clearNicknameError();
      }
      /* 生日 */
      if (
        !birthDate.value
      ) {
        birthDateError.classList.add("show");
        birthDate.classList.add("input-error");
        valid = false;
      } else {
        clearBirthDateError();
      }
      /* 撫養人數 */
      if (
        hasSupport.classList.contains("active")
      ) {
        const raw =
          countInput.value.trim();
        const count =
          Number(raw);
        if (
          raw === "" ||
          !Number.isInteger(count) ||
          count < 1 ||
          count > 20
        ) {
          supportCountError.classList.add("show");
          countInput.classList.add("input-error");
          valid = false;
        } else {
          clearSupportCountError();
        }
      } else {
        clearSupportCountError();
      }
      return valid;
    }
    /* ==================================================
       姓名
    ================================================== */
    nickname.addEventListener(
      "input",
      function () {
        clearNicknameError();
        saveData();
      }
    );
    /* ==================================================
       生日
    ================================================== */
    birthDate.addEventListener(
      "change",
      function () {
        clearBirthDateError();
        updateAge();
        saveData();
      }
    );
    /* ==================================================
       撫養選擇
    ================================================== */
    noSupport.addEventListener(
      "click",
      function () {
        noSupport.classList.add("active");
        hasSupport.classList.remove("active");
        supportCount.classList.remove("show");
        clearSupportCountError();
        saveData();
      }
    );
    hasSupport.addEventListener(
      "click",
      function () {
        hasSupport.classList.add("active");
        noSupport.classList.remove("active");
        supportCount.classList.add("show");
        if (
          !countInput.value ||
          Number(countInput.value) < 1
        ) {
          countInput.value = 1;
        }
        clearSupportCountError();
        saveData();
      }
    );
    /* ==================================================
       撫養人數
    ================================================== */
    function updateCount(value) {
      let number =
        Number(value);
      if (
        !Number.isFinite(number)
      ) {
        number = 1;
      }
      number =
        Math.round(number);
      number =
        Math.max(
          1,
          Math.min(
            20,
            number
          )
        );
      countInput.value =
        number;
      clearSupportCountError();
      saveData();
    }
    minusButton.addEventListener(
      "click",
      function () {
        updateCount(
          Number(countInput.value || 1) - 1
        );
      }
    );
    plusButton.addEventListener(
      "click",
      function () {
        updateCount(
          Number(countInput.value || 1) + 1
        );
      }
    );
    countInput.addEventListener(
      "input",
      function () {
        clearSupportCountError();
        saveData();
      }
    );
    countInput.addEventListener(
      "change",
      function () {
        const raw =
          countInput.value.trim();
        if (
          raw === ""
        ) {
          saveData();
          return;
        }
        const number =
          Number(raw);
        if (
          Number.isInteger(number) &&
          number >= 1 &&
          number <= 20
        ) {
          countInput.value =
            number;
        }
        saveData();
      }
    );
    /* ==================================================
       下一步
    ================================================== */
    nextButton.addEventListener(
      "click",
      function (event) {
        /*
          先保存
          即使驗證失敗，也不會清掉已輸入資料
        */
        saveData();
        if (
          !validateForm()
        ) {
          event.preventDefault();
          const firstError =
            document.querySelector(
              ".input-error"
            );
          if (
            firstError
          ) {
            firstError.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });
            setTimeout(
              function () {
                firstError.focus();
              },
              250
            );
          }
          return;
        }
        /*
          驗證成功
          supportCount 已經存在 localStorage
          finance.html 可以直接讀取
        */
        saveData();
      }
    );
    /* ==================================================
       啟動
    ================================================== */
    loadData();
  </script>
</body>
</html>
