<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>自由倒數｜財務自由試算</title>

    <style>
        body {
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f5f6f8;
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .hero {
            background: white;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 18px;
            line-height: 1.8;
            color: #666;
        }

        .start-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
        }

        .start-button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="hero">

            <h1>自由倒數｜財務自由試算</h1>

            <p class="subtitle">
                讓自由，不只是想像，而是一個可以計算的目標。
            </p>

            <p class="subtitle">
                輸入你的財務資料，試算退休需要多少資產，
                以及按照目前的儲蓄與投資速度，大約何時能達成。
            </p>

            <a href="#" class="start-button">
                開始試算
            </a>

        </div>

    </div>

</body>

</html>
