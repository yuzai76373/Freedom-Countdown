<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>自由倒數｜財務自由試算</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #242424;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    #e8eee8 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 10%,
                    #eee8dc 0%,
                    transparent 35%
                ),
                #f7f6f2;
        }

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 35px 20px 70px;
        }

        /* 網站名稱 */

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-main {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .brand-line {
            width: 45px;
            height: 3px;
            background: #6f7d68;
            margin: 12px auto 0;
            border-radius: 10px;
        }

        /* 主視覺 */

        .hero {
            position: relative;
            overflow: hidden;

            background: rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            padding: 85px 30px 80px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.07);
        }

        /* 左上裝飾 */

        .hero::before {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            background: #e8eee7;

            border-radius: 50%;

            top: -130px;
            left: -100px;

            opacity: 0.7;
        }

        /* 右下裝飾 */

        .hero::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            background: #eee8dc;

            border-radius: 50%;

            right: -90px;
            bottom: -100px;

            opacity: 0.7;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        /* 小標籤 */

        .tag {
            display: inline-block;

            padding: 8px 18px;

            border-radius: 30px;

            background: #edf0eb;

            color: #66705f;

            font-size: 14px;

            font-weight: 500;

            letter-spacing: 1px;

            margin-bottom: 28px;
        }

        /* 主標題 */

        h1 {
            margin: 0 auto;

            max-width: 760px;

            font-size: 42px;

            line-height: 1.5;

            letter-spacing: 1px;

            font-weight: 600;
        }

        /* 綠色強調文字 */

     .highlight {
    color: #536f4d;
    font-weight: 800;
    text-shadow: 0 1px 1px rgba(83, 111, 77, 0.08);
}

        /* 說明文字 */

        .description {
            margin: 28px auto 0;

            max-width: 620px;

            color: #777;

            font-size: 15px;

            line-height: 2;

            letter-spacing: 0.3px;
        }

        /* 開始試算按鈕 */

        .start-button {
            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-top: 38px;

            padding: 17px 32px;

            min-width: 190px;

            border-radius: 50px;

            background: #2f3930;

            color: white;

            text-decoration: none;

            font-size: 17px;

            font-weight: 600;

            letter-spacing: 1px;

            box-shadow:
                0 10px 25px rgba(47, 57, 48, 0.25);

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                background 0.25s;
        }

        .start-button span {
            font-size: 21px;

            transition:
                transform 0.25s;
        }

        .start-button:hover {
            transform: translateY(-4px);

            background: #3d4a3e;

            box-shadow:
                0 15px 30px rgba(47, 57, 48, 0.3);
        }

        .start-button:hover span {
            transform: translateX(5px);
        }

        /* 三個功能介紹 */

        .features {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 25px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.9);

            border-radius: 22px;

            padding: 30px 22px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .feature:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.07);
        }

        .feature-icon {
            width: 55px;
            height: 55px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #f0f2ed;

            font-size: 25px;
        }

        .feature h3 {
            margin: 0 0 10px;

            font-size: 17px;
        }

        .feature p {
            margin: 0;

            color: #888;

            font-size: 13px;

            line-height: 1.8;
        }

        /* 手機版 */

        @media (max-width: 700px) {

            .container {
                padding: 25px 15px 45px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .brand-main {
                font-size: 20px;
            }

            .hero {
                padding: 65px 22px 60px;

                border-radius: 24px;
            }

            h1 {
                font-size: 27px;

                line-height: 1.55;

                letter-spacing: 0.5px;
            }

            .description {
                font-size: 13px;

                line-height: 1.9;

                margin-top: 22px;
            }

            .start-button {
                margin-top: 30px;

                width: 85%;

                max-width: 260px;
            }

            .features {
                grid-template-columns: 1fr;

                gap: 14px;
            }

            .feature {
                padding: 25px 20px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- 網站名稱 -->

        <div class="brand">

            <div class="brand-main">
                自由倒數｜財務自由試算
            </div>

            <div class="brand-line"></div>

        </div>


        <!-- 主區塊 -->

        <section class="hero">

            <div class="hero-content">

                <!-- 小標籤 -->

                <div class="tag">
                    ✦ 財務自由試算工具
                </div>


                <!-- 主標題 -->

                <h1>

                    讓自由，不只是想像

                    <br>

                   <span class="highlight">
    而是可以計算的目標 🎯
</span>

                </h1>


                <!-- 說明 -->

                <p class="description">

                    ✍️ 輸入你的財務資料，試算退休需要多少資產，

                    <br>

                    以及按照目前的儲蓄與投資速度，大約何時能達成。

                </p>


                <!-- 開始試算 -->

                <a href="#" class="start-button">

                    開始試算

                    <span>
                        →
                    </span>

                </a>

            </div>

        </section>


        <!-- 三個功能 -->

        <div class="features">


            <div class="feature">

                <div class="feature-icon">
                    🎯
                </div>

                <h3>
                    找到你的自由目標
                </h3>

                <p>
                    試算需要累積多少資產，
                    才能支撐你想要的生活。
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    📈
                </div>

                <h3>
                    看見資產成長
                </h3>

                <p>
                    根據目前資產、投入金額
                    與預期報酬率進行推估。
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">
                    ⏳
                </div>

                <h3>
                    開始你的自由倒數
                </h3>

                <p>
                    看看按照目前的速度，
                    大約何時可以達成目標。
                </p>

            </div>


        </div>

    </div>

</body>

</html>
