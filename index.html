<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F6F2E9">
  <meta name="description" content="自由倒數｜試算工具">
  <title>自由倒數｜試算工具</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F6F2E9;
      --paper: #FFFDF8;

      --green-dark: #29483B;
      --green: #5E806B;
      --green-soft: #E4EEE7;

      --blue-soft: #E5EEF0;
      --blue-text: #52727A;

      --peach-soft: #F5E7D9;
      --peach-text: #9A6E4D;

      --gold-soft: #F2EBD5;
      --gold-text: #8B7540;

      --text: #2D3934;
      --muted: #748078;

      --border: rgba(83, 111, 97, 0.14);

      --shadow:
        0 16px 38px rgba(59, 76, 67, 0.09),
        0 3px 10px rgba(59, 76, 67, 0.04);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        radial-gradient(
          circle at 92% 4%,
          rgba(218, 231, 222, 0.7) 0,
          rgba(218, 231, 222, 0.25) 12%,
          transparent 27%
        ),
        var(--bg);

      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ------------------------------
       裝飾
    ------------------------------ */

    .decor {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .decor-1 {
      width: 150px;
      height: 150px;
      top: -70px;
      right: -55px;
      background: rgba(204, 222, 211, 0.48);
    }

    .decor-2 {
      width: 90px;
      height: 90px;
      left: -45px;
      bottom: 80px;
      background: rgba(239, 224, 205, 0.5);
    }

    .decor
