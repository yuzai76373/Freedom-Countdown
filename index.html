<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="自由倒數｜財務自由試算工具">
  <title>自由倒數｜試算工具</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f5ef;
      --card: #ffffff;
      --green-dark: #315c4a;
      --green: #4f8069;
      --green-light: #e6f0ea;
      --green-soft: #eef5f0;
      --text: #26352f;
      --text-light: #6f7d76;
      --line: #dce6e0;
      --shadow: 0 10px 30px rgba(55, 76, 66, 0.08);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font-family: inherit;
    }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* 裝飾圓 */
    .circle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .circle.one {
      width: 150px;
      height: 150px;
      background: #e6f0ea;
      top: -75px;
      right: -55px;
    }

    .circle.two {
      width: 95px;
      height: 95px;
      background: #edf3ee;
      bottom: 70px;
      left: -45px;
    }

    .circle.three {
      width: 42px;
      height: 42px;
      background: #dfece5;
      top: 23%;
      left: 7%;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      min-height: 100svh;
      padding: 30px 18px 22px;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 */
    .brand {
      text-align: center;
      margin-top: 2px;
    }

    .brand-title {
      font-size: clamp(20px, 5.4vw, 27px);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--green-dark);
      line-height: 1.3;
    }

    .brand-subtitle {
      margin-top: 9px;
      font-size: clamp(13px, 3.4vw, 15px);
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--green);
      line-height: 1.4;
    }

    /* 主標題 */
    .hero {
      text-align: center;
      margin-top: clamp(34px, 8vh, 58px);
    }

    .hero h1 {
      font-size: clamp(27px, 7.3vw, 38px);
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--green-dark);
    }

    .hero-description {
      margin: 17px auto 0;
      max-width: 500px;
      font-size: clamp(15px, 4vw, 17px);
      line-height: 1.9;
      color: var(--text-light);
      letter-spacing: 0.02em;
    }

    /* 三張特色卡 */
    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: clamp(28px, 6vh, 42px);
    }

    .feature-card {
      min-width: 0;
      background: var(--card);
      border: 1px solid rgba(220, 230, 224, 0.9);
      border-radius: 18px;
      padding: 17px 9px 16px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .feature-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--green-soft);
      font-size: 21px;
    }

    .feature-title {
      font-size: clamp(14px, 3.7vw, 17px);
      line-height: 1.4;
      font-weight: 800;
      color: var(--green-dark);
      white-space: nowrap;
    }

    .feature-text {
      margin-top: 8px;
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.65;
      color: var(--text-light);
      word-break: keep-all;
    }

    /* 開始按鈕 */
    .start-area {
      display: flex;
      justify-content: center;
      margin-top: clamp(28px, 5vh, 40px);
    }

    .start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 210px;
      min-height: 50px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--green);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(79, 128, 105, 0.22);
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .start-button:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(79, 128, 105, 0.25);
    }

    .start-button:active {
      transform: translateY(1px);
      box-shadow: 0 5px 12px rgba(79, 128, 105, 0.18);
    }

    /* 頁尾 */
    .footer {
      margin-top: auto;
      padding-top: 25px;
      text-align: center;
      color: #87948e;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    /* 小螢幕 */
    @media (max-width: 380px) {
      .container {
        padding-left: 13px;
        padding-right: 13px;
        padding-top: 24px;
      }

      .features {
        gap: 7px;
      }

      .feature-card {
        border-radius: 16px;
        padding-left: 6px;
        padding-right: 6px;
      }

      .feature-icon {
        width: 36px;
        height: 36px;
        font-size: 19px;
      }

      .feature-text {
        font-size: 10.5px;
        line-height: 1.6;
      }

      .start-area {
        margin-top: 23px;
      }

      .start-button {
        min-width: 190px;
      }
    }

    /* 較大的螢幕 */
    @media (min-width: 600px) {
      .container {
        padding-left: 30px;
        padding-right: 30px;
      }

      .features {
        gap: 16px;
      }

      .feature-card {
        padding: 22px 15px 20px;
      }

      .feature-icon {
        width: 46px;
        height: 46px;
        font-size: 23px;
      }
    }

    /* 避免手機橫向時版面過高 */
    @media (max-height: 700px) {
      .container {
        padding-top: 20px;
        padding-bottom: 15px;
      }

      .hero {
        margin-top: 25px;
      }

      .hero-description {
        margin-top: 12px;
        line-height: 1.7;
      }

      .features {
        margin-top: 22px;
      }

      .start-area {
        margin-top: 20px;
      }

      .footer {
        padding-top: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="container">

      <!-- 品牌 -->
      <header class="brand">
        <div class="brand-title">自由倒數｜試算工具</div>
        <div class="brand-subtitle">F I R E・人生規劃</div>
      </header>

      <!-- 主視覺 -->
      <section class="hero">
        <h1>提早過，你真正想過的生活</h1>

        <p class="hero-description">
          從現在的財務狀況出發，<br>
          設定你想要的自由生活，<br>
          看看距離目標還有多遠。
        </p>
      </section>

      <!-- 三個特色 -->
      <section class="features">

        <article class="feature-card">
          <div class="feature-icon">🧭</div>
          <h2 class="feature-title">看見現在</h2>
          <p class="feature-text">
            整理收入、<br>
            支出、資產<br>
            與負債
          </p>
        </article>

        <article class="feature-card">
          <div class="feature-icon">🎯</div>
          <h2 class="feature-title">設定目標</h2>
          <p class="feature-text">
            找到屬於你<br>
            的自由數字
          </p>
        </article>

        <article class="feature-card">
          <div class="feature-icon">⏳</div>
          <h2 class="feature-title">開始倒數</h2>
          <p class="feature-text">
            看看距離<br>
            自由還有<br>
            多久
          </p>
        </article>

      </section>

      <!-- 開始 -->
      <div class="start-area">
        <a class="start-button" href="basic.html">
          開始你的自由規劃 →
        </a>
      </div>

      <!-- 頁尾 -->
      <footer class="footer">
        © 2026 TY Chen
      </footer>

    </div>
  </main>
</body>
</html>
